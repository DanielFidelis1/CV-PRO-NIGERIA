<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - CVPro Nigeria</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

    <div class="logo">
        CVPro<span>Nigeria</span>
    </div>

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="track-order.html">
            Track Order
        </a>

        <a href="login.html">
            Login
        </a>

        <a
            href="order.html"
            class="nav-button"
        >
            Get Started
        </a>

    </nav>

</header>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <p class="section-small">
                    GET STARTED
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Create an account to manage and track your CV orders.
                </p>

            </div>


            <form id="signup-form">

                <div class="form-group">

                    <label for="signup-name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="e.g. Daniel Oshioke"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signup-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signup-password-confirm">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="signup-password-confirm"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Create Account
                </button>


                <div id="signup-message"></div>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 CVPro Nigeria. All rights reserved.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
