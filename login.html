<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CVPro Nigeria</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

    <div class="logo">
        CVPro<span>Nigeria</span>
    </div>

    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="services.html">
            Services
        </a>

        <a href="track-order.html">
            Track Order
        </a>

        <a href="signup.html">
            Create Account
        </a>

        <a
            href="order.html"
            class="nav-button"
        >
            Get Started
        </a>

    </nav>

</header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <p class="section-small">
                    WELCOME BACK
                </p>

                <h1>
                    Login to CVPro
                </h1>

                <p>
                    Access your CV orders and track your progress.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="login-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Login
                </button>


                <div id="login-message"></div>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 CVPro Nigeria. All rights reserved.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
