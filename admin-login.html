<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - CVPro Nigeria</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="logo login-logo">
                CVPro<span>Nigeria</span>
            </div>

            <p class="login-label">
                ADMIN AREA
            </p>

            <h1>
                Welcome back
            </h1>

            <p class="login-description">
                Sign in to manage your CV orders.
            </p>


            <form id="admin-login-form">

                <div class="form-group">

                    <label for="admin-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="login-button"
                >
                    Sign In
                </button>

                <p
                    id="login-message"
                    class="form-message"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
